<!DOCTYPE html>
<html lang="am" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="google" content="notranslate" />
<title>መንጃ ፍቃድ - በቀላል መንገድ በአማርኛ በነፃ ተማሩ!</title>
<meta property="og:title" content="መንጃ ፍቃድ - በቀላል መንገድ በአማርኛ በነፃ ተማሩ!" />
<meta property="og:description" content="ማንበብ ለሚቸገሩም መተግበሪያው ጥያቄዎችንና ማብራሪያዎችን በድምፅ ያሰማቸዋል።" />
<meta property="og:image" content="https://driving-theory-docs.vercel.app/start-poster.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans Ethiopic','Nyala',Arial,sans-serif;background:#f4f7fb;color:#12233a;line-height:1.5;text-align:center;}
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px;}
  .logo{width:72px;height:72px;border-radius:18px;object-fit:contain;background:#fff;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12);}
  h1{font-size:1.9rem;font-weight:800;line-height:1.35;margin:14px 0 16px;color:#0d3b73;}
  video{width:100%;max-width:340px;aspect-ratio:9/16;border-radius:18px;background:#000;display:block;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .btn{display:block;width:100%;max-width:340px;margin:0 auto;border:0;border-radius:18px;font-family:inherit;font-weight:800;color:#fff;text-decoration:none;cursor:pointer;}
  .play{margin-top:18px;background:#0d3b73;padding:20px 14px;font-size:1.5rem;box-shadow:0 6px 0 #082a52;}
  .play small{display:block;font-size:1rem;font-weight:500;opacity:.9;margin-top:4px;}
  .plat{margin:14px auto 0;font-size:1.05rem;font-weight:700;color:#445;}
  hr{border:0;border-top:2px dashed #c9d3e0;margin:34px auto 26px;max-width:340px;}
  .sharetext{font-size:1.35rem;font-weight:800;margin-bottom:16px;color:#12233a;}
  .share{background:#1faa3c;padding:26px 14px;font-size:1.8rem;box-shadow:0 8px 0 #137a29;}
  .share{display:flex;align-items:center;justify-content:center;gap:14px;}
  .share .ico{width:44px;height:44px;flex:none;}
  .share:active,.play:active{transform:translateY(4px);}
  .copied{display:none;margin-top:14px;font-size:1.05rem;font-weight:700;color:#137a29;}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="" />
  <h1>መንጃ ፍቃድ - በቀላል መንገድ<br>በአማርኛ በነፃ ተማሩ!</h1>

  <video id="v" controls playsinline preload="metadata" poster="start-poster.jpg">
    <source src="start-promo.mp4" type="video/mp4" />
  </video>

  <a id="play" class="btn play" href="https://play.google.com/store/apps/details?id=com.drivingtheory.ethiopian">አውርደው ለመጫን እዚህ ይጫኑ</a>
  <p class="plat">አሁን በአንድሮይድ ይገኛል። በቅርብ ቀን በአይፎንም።</p>

  <hr />
  <p class="sharetext">መንጃ ፍቃድ መማር የሚፈልግና በቋንቋ የሚቸገር ሰው ታውቃላችሁ? አሳውቋቸው!</p>
  <button id="share" class="btn share" type="button">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
    <span>ለሚያስፈልጋቸው ያጋሩ</span>
  </button>
  <p id="copied" class="copied">አገናኙ ተቀድቷል። አሁን መለጠፍ እና መላክ ይችላሉ።</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = (q.get('src') || 'web').replace(/[^a-zA-Z0-9_\-]/g, '').slice(0, 40) || 'web';
  // Counts only (place tag + event name), no personal data. Add-only table, see backend/migration_flyer_page_events.sql
  function track(ev) {
    try {
      fetch('https://bpltieicivxixpogxfim.supabase.co/rest/v1/flyer_page_events', { method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', 'apikey': 'sb_publishable_4WR8F7PEfqRJOT4_fNUO-w_HZd3ssEG', 'Authorization': 'Bearer sb_publishable_4WR8F7PEfqRJOT4_fNUO-w_HZd3ssEG', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ src: src, event: ev }) }).catch(function () {});
    } catch (e) {}
  }
  try { if (!sessionStorage.getItem('visited')) { sessionStorage.setItem('visited', '1'); track('visit'); } } catch (e) { track('visit'); }
  var play = document.getElementById('play');
  play.addEventListener('click', function () { track('play_click'); });
  play.href = play.href + '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=qr_page');

  // The link that gets shared is this page, marked as "shared" so installs that come from sharing can be told apart.
  var shareUrl = location.origin + location.pathname + '?src=shared';
  var msg = "በአማርኛ መንዳት ይማሩ፣ በነጻ! ቪዲዮውን ይመልከቱ እና አፕሊኬሽኑን ያውርዱ:";
  document.getElementById('share').addEventListener('click', function () {
    track('share_click');
    if (navigator.share) {
      navigator.share({ text: msg, url: shareUrl }).catch(function () {});
    } else {
      // No system share menu: open WhatsApp with the message, the most used app for this community.
      window.open('https://wa.me/?text=' + encodeURIComponent(msg + ' ' + shareUrl), '_blank');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(msg + ' ' + shareUrl).then(function () {
          document.getElementById('copied').style.display = 'block';
        }).catch(function () {});
      }
    }
  });
})();
</script>
</body>
</html>
