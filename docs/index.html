<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>መንጃ ፍቃድ በቀላል መንገድ — App Info</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f7f9fb;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    }
    .flag { font-size: 3rem; margin-bottom: 16px; }
    h1 {
      font-size: 1.7rem;
      color: #1565C0;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .subtitle {
      color: #666;
      font-size: 1rem;
      margin-bottom: 32px;
    }
    .package {
      background: #E3F2FD;
      color: #1565C0;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-family: monospace;
      display: inline-block;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      display: block;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    .link-btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #1565C0;
      color: #fff;
    }
    .btn-secondary {
      background: #E8F5E9;
      color: #2E7D32;
      border: 2px solid #2E7D32;
    }
    .contact {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #999;
    }
    .contact a { color: #1565C0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="flag">🇪🇹🚗</div>
    <h1>መንጃ ፍቃድ<br/>በቀላል መንገድ</h1>
    <p class="subtitle">Driving Theory App in Amharic<br/>for Ethiopians Worldwide</p>
    <div class="package">com.drivingtheory.ethiopian</div>
    <div class="links">
      <a class="link-btn btn-primary" href="/privacy-policy.html">
        🔒 Privacy Policy / የግላዊነት ፖሊሲ
      </a>
    </div>
    <div class="contact">
      Contact: <a href="mailto:moti.marva@gmail.com">moti.marva@gmail.com</a>
    </div>
  </div>
</body>
</html>
